<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b10">
<title>ShineZone Detail — Turnos</title>
<link rel="icon" type="image/png" href="icon-1024.png">
<link rel="apple-touch-icon" href="icon-1024.png">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#050b10;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
:root{--yellow:#ffd928;--green:#16c76b;--red:#ff3150;--card:#0b141c;--line:#25333f}
.app{max-width:1100px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.brand{font-weight:900;font-size:30px;color:var(--yellow);letter-spacing:2px}.sub{font-size:12px;color:#9da8b1;letter-spacing:3px;margin-top:3px}
button{border:0;cursor:pointer;font-weight:800}.primary{background:var(--yellow);color:#111;padding:13px 18px;border-radius:13px}.copybtn{background:#16c76b;color:#fff;padding:13px 18px;border-radius:13px}.headerbuttons{display:flex;gap:10px;align-items:center}
.days{display:flex;overflow:auto;background:#0b141c;border:1px solid var(--line);border-radius:18px;margin-bottom:20px}
.daytab{min-width:100px;padding:15px 12px;background:transparent;color:#aeb8c0}.daytab.active{color:var(--yellow);box-shadow:inset 0 -3px var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:linear-gradient(145deg,#0b141c,#071018);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:160px}
h2{margin:0 0 12px;color:var(--yellow);font-size:20px}.closed{color:#9da8b1;font-size:13px;background:#17222b;border-radius:9px;padding:7px 10px;display:inline-block}
.slot{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;border:1px solid #25333f;border-radius:13px;padding:10px;margin:9px 0;background:#09121a}
.time{font-size:17px;font-weight:900;background:#111d27;padding:9px;border-radius:10px;text-align:center}.status{font-size:11px;font-weight:900;padding:6px 9px;border-radius:20px;display:inline-block}.free{color:#fff;background:var(--green)}.busy{color:#fff;background:var(--red)}
.name{font-weight:800;margin-top:5px}.service{font-size:12px;color:#9da8b1;margin-top:3px}.actions button{background:transparent;color:#dbe2e7;font-size:18px;margin-left:3px}
.empty{text-align:center;color:#9da8b1;padding:20px}.mobilecopy{display:none;margin:-6px 0 16px}.mobilecopy .copybtn{width:100%}.fab{position:fixed;right:25px;bottom:25px;width:58px;height:58px;border-radius:50%;background:var(--yellow);font-size:28px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(440px,100%);background:#0b141c;border:1px solid var(--line);border-radius:20px;padding:22px}.box h3{margin-top:0;color:var(--yellow)}
label{display:block;font-size:12px;color:#aeb8c0;margin:12px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071018;color:#fff;font-size:16px}
.formbuttons{display:flex;gap:10px;margin-top:18px}.secondary{background:#17222b;color:#fff;padding:12px 16px;border-radius:10px}
footer{margin-top:25px;padding:18px;color:#aeb8c0;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.app{padding:14px}.grid{grid-template-columns:1fr}.brand{font-size:22px}header .primary{display:none}.headerbuttons{width:auto;justify-content:flex-end}.copybtn{padding:11px 13px;font-size:13px}.slot{grid-template-columns:65px 1fr auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="brand">SHINEZONE</div><div class="sub">DETAIL · TURNOS</div></div>
  <div class="headerbuttons">
    <button class="copybtn" id="copyBtn" onclick="copyAvailable()">📋 Copiar disponibilidad</button>
    <button class="primary" onclick="openNew()">＋ Agregar turno</button>
  </div>
</header>
<div class="days" id="tabs"></div>
<div class="grid" id="cards"></div>
<footer><span>📍 Ensenada</span><span>📞 +54 221 306-1976</span><span>◎ @ShineZone.detail</span></footer>
</div>
<button class="fab" onclick="openNew()">＋</button>

<div class="modal" id="modal">
<div class="box">
<h3 id="modalTitle">Agregar turno</h3>
<label>Día</label><select id="day"></select>
<label>Horario</label><select id="time"></select>
<label>Nombre del cliente</label><input id="name" placeholder="Ej: Juan Pérez">
<label>Servicio (opcional)</label><input id="service" placeholder="Ej: Detailing completo">
<div class="formbuttons">
<button class="primary" onclick="saveBooking()">Guardar</button>
<button class="secondary" onclick="closeModal()">Cancelar</button>
</div>
</div></div>

<script>
const schedule={
"Lunes":[],
"Martes":["10:00","13:00"],
"Miércoles":["15:00"],
"Jueves":["10:00","13:00","15:30"],
"Viernes":["14:00","16:00"],
"Sábado":["09:00","12:00","15:00"],
"Domingo":[]
};
const closed=["Lunes","Domingo"];
let bookings=JSON.parse(localStorage.getItem("shinezone_bookings")||"{}");
let selectedDay="Martes", editingKey=null;

function key(d,t){return d+"_"+t}
function render(){
  tabs.innerHTML=Object.keys(schedule).map(d=>`<button class="daytab ${d===selectedDay?'active':''}" onclick="selectDay('${d}')">${d.slice(0,3).toUpperCase()}</button>`).join("");
  const d=selectedDay;
  const times=schedule[d]||[];
  if(closed.includes(d)){
    cards.innerHTML=`<div class="card"><h2>${d}</h2><span class="closed">NO TRABAJO</span><div class="empty">No hay turnos disponibles.</div></div>`;
    return;
  }
  cards.innerHTML=`<div class="card"><h2>Turnos del ${d}</h2>${times.map(t=>{
    const b=bookings[key(d,t)];
    return `<div class="slot">
      <div class="time">${t}</div>
      <div>${b?`<span class="status busy">OCUPADO</span><div class="name">${esc(b.name)}</div><div class="service">${esc(b.service||"")}</div>`:`<span class="status free">DISPONIBLE</span>`}</div>
      <div class="actions">${b?`<button title="Editar" onclick="editBooking('${d}','${t}')">✎</button><button title="Eliminar" onclick="deleteBooking('${d}','${t}')">🗑</button>`:`<button title="Agregar turno" onclick="openNewFor('${d}','${t}')">＋</button>`}</div>
    </div>`;
  }).join("")}</div>`;
}
function selectDay(d){selectedDay=d;render()}
function openNewFor(d,t){
  editingKey=null;modalTitle.textContent="Agregar turno";fillDays();day.value=d;updateTimes();time.value=t;
  name.value="";service.value="";modal.classList.add("show");
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillDays(){day.innerHTML=Object.keys(schedule).filter(d=>!closed.includes(d)).map(d=>`<option>${d}</option>`).join(""); updateTimes()}
function updateTimes(){const d=day.value;time.innerHTML=(schedule[d]||[]).map(t=>`<option>${t}</option>`).join("")}
day.addEventListener("change",updateTimes);
function openNew(){
 editingKey=null;modalTitle.textContent="Agregar turno";fillDays();day.value=selectedDay==="Lunes"||selectedDay==="Domingo"?"Martes":selectedDay;updateTimes();
 name.value="";service.value="";modal.classList.add("show");
}
function editBooking(d,t){
 editingKey=key(d,t);modalTitle.textContent="Editar turno";fillDays();day.value=d;updateTimes();time.value=t;
 name.value=bookings[editingKey].name;service.value=bookings[editingKey].service||"";modal.classList.add("show");
}
function saveBooking(){
 const d=day.value,t=time.value,n=name.value.trim();
 if(!n){alert("Poné el nombre del cliente.");return}
 const old=editingKey;
 if(old && old!==key(d,t)) delete bookings[old];
 const k=key(d,t);
 if(bookings[k] && k!==old){alert("Ese turno ya está ocupado.");return}
 bookings[k]={name:n,service:service.value.trim()};
 localStorage.setItem("shinezone_bookings",JSON.stringify(bookings));selectedDay=d;closeModal();render();
}
function deleteBooking(d,t){
 if(confirm(`¿Sacar el turno de ${bookings[key(d,t)].name}?`)){delete bookings[key(d,t)];localStorage.setItem("shinezone_bookings",JSON.stringify(bookings));render()}
}
function buildAvailableMessage(){
  const lines=["¡Hola! 👋 Estos son los turnos disponibles en ShineZone Detail:",""];
  let total=0;
  for(const [d,times] of Object.entries(schedule)){
    if(closed.includes(d)) continue;
    const free=times.filter(t=>!bookings[key(d,t)]);
    if(!free.length) continue;
    lines.push(`📅 ${d}`);
    free.forEach(t=>{lines.push(`• ${t}`); total++;});
    lines.push("");
  }
  if(!total) return "¡Hola! 👋 En este momento no tengo turnos disponibles. Si querés, te aviso cuando se libere uno. 🙌";
  lines.push("Decime cuál te queda mejor y te lo reservo. 🙌");
  return lines.join("\n");
}
async function copyAvailable(){
  const message=buildAvailableMessage();
  try{
    await navigator.clipboard.writeText(message);
  }catch(e){
    const ta=document.createElement("textarea");ta.value=message;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
  }
  const buttons=document.querySelectorAll(".copybtn");
  buttons.forEach(b=>{const old=b.textContent;b.textContent="✅ ¡Copiado!";setTimeout(()=>b.textContent=old,1800);});
}
function closeModal(){modal.classList.remove("show")}
render();
</script>
</body>
</html>
