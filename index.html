<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b10">
<title>ShineZone Detail — Turnos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b10;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
:root{--yellow:#ffd928;--green:#16c76b;--red:#ff3150;--card:#0b141c;--line:#25333f}
.app{max-width:1100px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.brand{font-weight:900;font-size:30px;color:var(--yellow);letter-spacing:2px}.sub{font-size:12px;color:#9da8b1;letter-spacing:3px;margin-top:3px}
button{border:0;cursor:pointer;font-weight:800}.primary{background:var(--yellow);color:#111;padding:13px 18px;border-radius:13px}
.days{display:flex;overflow:auto;background:#0b141c;border:1px solid var(--line);border-radius:18px;margin-bottom:20px}
.daytab{min-width:100px;padding:15px 12px;background:transparent;color:#aeb8c0}.daytab.active{color:var(--yellow);box-shadow:inset 0 -3px var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:linear-gradient(145deg,#0b141c,#071018);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:160px}
h2{margin:0 0 12px;color:var(--yellow);font-size:20px}.closed{color:#9da8b1;font-size:13px;background:#17222b;border-radius:9px;padding:7px 10px;display:inline-block}
.slot{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;border:1px solid #25333f;border-radius:13px;padding:10px;margin:9px 0;background:#09121a}
.time{font-size:17px;font-weight:900;background:#111d27;padding:9px;border-radius:10px;text-align:center}.status{font-size:11px;font-weight:900;padding:6px 9px;border-radius:20px;display:inline-block}.free{color:#fff;background:var(--green)}.busy{color:#fff;background:var(--red)}
.name{font-weight:800;margin-top:5px}.service{font-size:12px;color:#9da8b1;margin-top:3px}.actions button{background:transparent;color:#dbe2e7;font-size:18px;margin-left:3px}
.empty{text-align:center;color:#9da8b1;padding:20px}.fab{position:fixed;right:25px;bottom:25px;width:58px;height:58px;border-radius:50%;background:var(--yellow);font-size:28px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(440px,100%);background:#0b141c;border:1px solid var(--line);border-radius:20px;padding:22px}.box h3{margin-top:0;color:var(--yellow)}
label{display:block;font-size:12px;color:#aeb8c0;margin:12px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071018;color:#fff;font-size:16px}
.formbuttons{display:flex;gap:10px;margin-top:18px}.secondary{background:#17222b;color:#fff;padding:12px 16px;border-radius:10px}
footer{margin-top:25px;padding:18px;color:#aeb8c0;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.app{padding:14px}.grid{grid-template-columns:1fr}.brand{font-size:22px}header .primary{display:none}.slot{grid-template-columns:65px 1fr auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="brand">SHINEZONE</div><div class="sub">DETAIL · TURNOS</div></div>
  <button class="primary" onclick="openNew()">＋ Agregar turno</button>
</header>
<div class="days" id="tabs"></div>
<button class="primary" id="copyBtn" style="width:100%;margin-bottom:20px">📋 Copiar disponibilidad</button>
<div class="grid" id="cards"></div>
<footer><span>📍 Ensenada</span><span>📞 +54 221 306-1976</span><span>◎ @ShineZone.detail</span></footer>
</div>
<button class="fab" onclick="openNew()">＋</button>

<div class="modal" id="modal">
<div class="box">
<h3 id="modalTitle">Agregar turno</h3>
<label>Día</label><select id="day"></select>
<label>Horario</label><select id="time"></select>
<label>Nombre del cliente</label><input id="name" placeholder="Ej: Juan Pérez">
<label>Servicio (opcional)</label><input id="service" placeholder="Ej: Detailing completo">
<div class="formbuttons">
<button class="primary" onclick="saveBooking()">Guardar</button>
<button class="secondary" onclick="closeModal()">Cancelar</button>
</div>
</div></div>

<script>
"use strict";
const schedule={"Lunes":[],"Martes":["10:00","13:00"],"Miércoles":["15:00"],"Jueves":["10:00","13:00","15:30"],"Viernes":["14:00","16:00"],"Sábado":["09:00","12:00","15:00"],"Domingo":[]};
const closed=["Lunes","Domingo"];
const tabsEl=document.getElementById("tabs"), cardsEl=document.getElementById("cards"), modalEl=document.getElementById("modal"), titleEl=document.getElementById("modalTitle"), dayEl=document.getElementById("day"), timeEl=document.getElementById("time"), nameEl=document.getElementById("name"), serviceEl=document.getElementById("service"), copyBtn=document.getElementById("copyBtn");
let bookings={};
try{const raw=localStorage.getItem("shinezone_bookings"); if(raw) bookings=JSON.parse(raw)||{};}catch(e){bookings={};}
let selectedDay="Martes", editingKey=null;
const key=(d,t)=>d+"_"+t;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function saveData(){try{localStorage.setItem("shinezone_bookings",JSON.stringify(bookings));return true}catch(e){alert("No se pudo guardar en este iPhone. Revisá que Safari permita almacenamiento para esta página.");return false;}}
function render(){
 tabsEl.innerHTML=Object.keys(schedule).map(d=>`<button class="daytab ${d===selectedDay?"active":""}" data-day="${esc(d)}">${d.slice(0,3).toUpperCase()}</button>`).join("");
 tabsEl.querySelectorAll(".daytab").forEach(b=>b.addEventListener("click",()=>{selectedDay=b.dataset.day;render();}));
 const times=schedule[selectedDay]||[];
 if(closed.includes(selectedDay)){cardsEl.innerHTML=`<div class="card"><h2>${selectedDay}</h2><span class="closed">NO TRABAJO</span><div class="empty">No hay turnos disponibles.</div></div>`;return;}
 cardsEl.innerHTML=`<div class="card"><h2>${selectedDay}</h2>${times.map(t=>{const b=bookings[key(selectedDay,t)];return `<div class="slot"><div class="time">${t}</div><div>${b?`<span class="status busy">OCUPADO</span><div class="name">${esc(b.name)}</div><div class="service">${esc(b.service||"")}</div>`:`<span class="status free">DISPONIBLE</span>`}</div><div class="actions">${b?`<button class="edit" data-time="${t}">✎</button><button class="delete" data-time="${t}">🗑</button>`:`<button class="add" data-time="${t}" style="color:#ffd928;font-size:22px;background:transparent">＋</button>`}</div></div>`;}).join("")}</div>`;
 cardsEl.querySelectorAll(".add").forEach(b=>b.addEventListener("click",()=>openNew(selectedDay,b.dataset.time)));
 cardsEl.querySelectorAll(".edit").forEach(b=>b.addEventListener("click",()=>editBooking(selectedDay,b.dataset.time)));
 cardsEl.querySelectorAll(".delete").forEach(b=>b.addEventListener("click",()=>deleteBooking(selectedDay,b.dataset.time)));
}
function fillDays(){dayEl.innerHTML=Object.keys(schedule).filter(d=>!closed.includes(d)).map(d=>`<option value="${esc(d)}">${d}</option>`).join("");updateTimes();}
function updateTimes(){const d=dayEl.value;timeEl.innerHTML=(schedule[d]||[]).map(t=>`<option value="${t}">${t}</option>`).join("");}
function openNew(d=selectedDay,t=""){editingKey=null;titleEl.textContent="Agregar turno";fillDays();if(closed.includes(d))d="Martes";dayEl.value=d;updateTimes();if(t)timeEl.value=t;nameEl.value="";serviceEl.value="";modalEl.classList.add("show");setTimeout(()=>nameEl.focus(),100);}
function editBooking(d,t){editingKey=key(d,t);titleEl.textContent="Editar turno";fillDays();dayEl.value=d;updateTimes();timeEl.value=t;nameEl.value=bookings[editingKey]?.name||"";serviceEl.value=bookings[editingKey]?.service||"";modalEl.classList.add("show");setTimeout(()=>nameEl.focus(),100);}
function saveBooking(){
 try{
  const d=dayEl.value,t=timeEl.value,n=nameEl.value.trim(),svc=serviceEl.value.trim();
  if(!d||!t){alert("Elegí día y horario.");return;}
  if(!n){alert("Poné el nombre del cliente.");nameEl.focus();return;}
  const old=editingKey,k=key(d,t);
  if(bookings[k]&&k!==old){alert("Ese turno ya está ocupado.");return;}
  if(old&&old!==k)delete bookings[old];
  bookings[k]={name:n,service:svc};
  if(!saveData())return;
  selectedDay=d;editingKey=null;modalEl.classList.remove("show");render();
 }catch(e){alert("Error al guardar: "+e.message);}
}
function deleteBooking(d,t){const b=bookings[key(d,t)];if(b&&confirm(`¿Sacar el turno de ${b.name}?`)){delete bookings[key(d,t)];saveData();render();}}
function closeModal(){modalEl.classList.remove("show");editingKey=null;}
function copyAvailability(){let msg="¡Hola! 👋 Estos son los turnos disponibles en ShineZone Detail:\n\n",found=false;for(const [d,times] of Object.entries(schedule)){const free=times.filter(t=>!bookings[key(d,t)]);if(free.length){found=true;msg+=`📅 ${d}\n`;free.forEach(t=>msg+=`• ${t}\n`);msg+="\n";}}if(!found)msg="¡Hola! 👋 En este momento no tengo turnos disponibles. Si querés, te aviso cuando se libere uno. 🙌";else msg+="Decime cuál te queda mejor y te lo reservo. 🙌";navigator.clipboard?.writeText(msg).then(()=>{copyBtn.textContent="✅ ¡Copiado!";setTimeout(()=>copyBtn.textContent="📋 Copiar disponibilidad",1500)}).catch(()=>{const ta=document.createElement("textarea");ta.value=msg;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();copyBtn.textContent="✅ ¡Copiado!";setTimeout(()=>copyBtn.textContent="📋 Copiar disponibilidad",1500);});}
dayEl.addEventListener("change",updateTimes);
document.querySelectorAll(".primary").forEach(b=>b.addEventListener("click",()=>openNew()));
document.querySelectorAll(".secondary").forEach(b=>b.addEventListener("click",closeModal));
document.querySelectorAll(".formbuttons .primary").forEach(b=>b.addEventListener("click",saveBooking));
copyBtn.addEventListener("click",copyAvailability);
render();
</script>
</body>
</html>
